<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tony Shin</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/post.css">


</head>

<body>
    <header>
        <h2 id="title">Tony Shin</h2>
        <nav id="navbar">
            <ul>
                <li class="navbar-link"><a href="#">Frames</a></li>
                <li class="navbar-link"><a href="#">About</a></li>
                <li class="navbar-link"><a href="#">Contact</a></li>
            </ul>
        </nav>

        <button class="menu-toggle" aria-label="open navigation menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="menu">
            <ul>
                <li class="menu-link"><a href="#">Frames</a></li>
                <li class="menu-link"><a href="#">About</a></li>
                <li class="menu-link"><a href="#">Contact</a></li>
            </ul>
        </div>
    </header>

    <section class="hero">
        <h1 class="animation active">Day In Frame</h1>
        <p>Life is beautiful</p>
    </section>

    <section class="filters">
        <input type="search" id="search-input" placeholder="Search posts..." />

        <div class="filter-buttons">
            <button type="button" class="filter-btn active" data-category="all">All</button>
            <button type="button" class="filter-btn" data-category="cooking-life">Cooking</button>
            <button type="button" class="filter-btn" data-category="farm-life">Farm</button>
            <button type="button" class="filter-btn" data-category="art-life">Art</button>
            <button type="button" class="filter-btn" data-category="daily-life">Daily</button>

        </div>
    </section>

    <main class="post" id="post-container">
    </main>

    <section class='quote'>
        <span class="quote-indication">Life Wisdom
        </span>
        <p class="quote-content"></p>
        <p class="author"></p>
    </section>

    <section class="old-post">
    </section>

    <button type="button" class="show-more">Show more</button>
    <button type="button" class="show-less">Show less</button>


    <section class="banner">
        <img src="https://res.cloudinary.com/brtweu9w/image/upload/v1793157450/5.jpg" alt="Born from love of kimchi">
    </section>

    <footer>
        <p class="brand">Tony Shin</p>
        <p class="copy-right">&copy; 2026 Tony Shin. All rights reserved.</p>
    </footer>
    <script src="/js/index.js"></script>
</body>

</html>
